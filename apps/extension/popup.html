<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lead Desk Connector</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #faf9f6;
      color: #1a1a1a;
      box-sizing: border-box;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-sender { background: #dcfce7; color: #15803d; }
    .badge-grace { background: #fef9c3; color: #854d0e; }
    .badge-standby { background: #f3f4f6; color: #4b5563; }
    .badge-unpaired { background: #fee2e2; color: #b91c1c; }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #555;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-primary { background: #1a1a1a; color: #fff; }
    .btn-primary:hover { background: #333; }
    .btn-danger { background: #ef4444; color: #fff; margin-top: 8px; }
    .btn-danger:hover { background: #dc2626; }
    .error-msg {
      color: #dc2626;
      font-size: 12px;
      margin-top: 6px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-label { color: #6b7280; }
    .info-value { font-weight: 500; font-family: monospace; }
  </style>
</head>
<body>
  <h2>
    Lead Desk
    <span id="role-badge" class="badge badge-unpaired">Unpaired</span>
  </h2>

  <!-- Unpaired View -->
  <div id="unpaired-view">
    <div class="form-group">
      <label for="server-url">Server Address</label>
      <input type="text" id="server-url" list="server-url-options" value="http://127.0.0.1:8787" spellcheck="false" autocomplete="off">
      <datalist id="server-url-options">
        <option value="http://127.0.0.1:8787"></option>
        <option value="https://"></option>
      </datalist>
      <div style="font-size: 11px; color: #6b7280; margin-top: 4px;">This computer: http://127.0.0.1:8787 &middot; VPS: https://your-domain</div>
    </div>

    <div class="form-group">
      <label for="device-label">Device Label</label>
      <input type="text" id="device-label" placeholder="e.g. Brave on Desk" value="Chrome Extension">
    </div>

    <div class="form-group">
      <label for="pairing-code">Pairing Code (8 characters)</label>
      <input type="text" id="pairing-code" maxlength="8" placeholder="e.g. K7H2M9QW" style="letter-spacing: 2px; text-transform: uppercase; font-family: monospace;">
    </div>

    <div id="pair-error" class="error-msg" style="display: none;"></div>

    <button id="pair-btn" class="btn btn-primary" style="margin-top: 8px;">Pair Extension</button>
  </div>

  <!-- Paired View -->
  <div id="paired-view" style="display: none;">
    <div class="info-row">
      <span class="info-label">Device</span>
      <span id="paired-label" class="info-value"></span>
    </div>
    <div class="info-row">
      <span class="info-label">Server</span>
      <span id="paired-server" class="info-value"></span>
    </div>
    <div class="info-row">
      <span class="info-label">WhatsApp Tab</span>
      <span id="paired-tab" class="info-value"></span>
    </div>

    <button id="unpair-btn" class="btn btn-danger">Unpair / Disconnect</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
